AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "ScamGuard MVP - Serverless Architecture (Phase 1 Day 4) Lambda + API\
  \ Gateway + Cognito + Aurora Serverless v2 Migration target: replaces Express.js\
  \ dev-server.js + DynamoDB DO NOT deploy to production — dev account only until\
  \ Phase 5.\n"
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    Description: Deployment environment
  AuroraClusterArn:
    Type: String
    Description: 'ARN of the Aurora Serverless v2 cluster. Exported by AuroraStack
      as ScamGuard-Dev-ClusterArn.

      '
    Default: arn:aws:rds:us-east-1:034362029181:cluster:scamguard-dev
  AuroraSecretArn:
    Type: String
    Description: 'Secrets Manager ARN for Aurora DB credentials. Exported by AuroraStack
      as ScamGuard-Dev-SecretArn.

      '
    Default: arn:aws:secretsmanager:us-east-1:034362029181:secret:scamguard/dev/aurora-credentials-8ScMGe
  AuroraDatabaseName:
    Type: String
    Default: scamguard
    Description: PostgreSQL database name
  CognitoUserPoolArn:
    Type: String
    Description: 'Cognito User Pool ARN for JWT authorizer. Retrieve from existing
      ScamGuard SAM stack output: ScamGuard-UserPoolId-<env>

      '
    Default: ''
  OpenAIApiKeyParam:
    Type: String
    Default: /scamguard/openai-key
    Description: SSM Parameter Store path for OpenAI key
  GeminiApiKeyParam:
    Type: String
    Default: /scamguard/gemini-key
    Description: SSM Parameter Store path for Gemini key
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security group ID for Lambda VPC attachment. Exported by AuroraStack
      as ScamGuard-Dev-LambdaSecurityGroupId.

      '
    Default: sg-05fea520e656efe48
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: 'Private (with-egress) subnet IDs from the Aurora VPC. Lambda functions
      must be in PRIVATE_WITH_EGRESS subnets (not isolated) so they can reach Secrets
      Manager, SNS, and Cognito via the NAT gateway.

      '
    Default: subnet-0d56c53f3df6b63ef,subnet-08180ec5b138ad32f
Globals:
  Function:
    Runtime: python3.12
    Architectures:
    - x86_64
    Timeout: 60
    MemorySize: 1536
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        AURORA_CLUSTER_ARN:
          Ref: AuroraClusterArn
        AURORA_SECRET_ARN:
          Ref: AuroraSecretArn
        AURORA_DATABASE:
          Ref: AuroraDatabaseName
        OPENAI_PARAM:
          Ref: OpenAIApiKeyParam
        GEMINI_PARAM:
          Ref: GeminiApiKeyParam
Resources:
  ScamGuardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Description: ScamGuard MVP API (Aurora-backed, replaces Express.js)
      CorsConfiguration:
        AllowOrigins:
        - https://scamguard.ca
        - http://localhost:3000
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Authorization
        - Content-Type
        - X-Amz-Date
        - X-Api-Key
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJWTAuthorizer
        Authorizers:
          CognitoJWTAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Audience:
              - Ref: ScamGuardUserPoolClient
              Issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${ScamGuardUserPool}
  ScamGuardUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: scamguard-aurora-${Environment}
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
        - Name: verified_email
          Priority: 1
      Schema:
      - Name: email
        AttributeDataType: String
        Required: true
        Mutable: false
  ScamGuardUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: ScamGuardUserPool
      ClientName:
        Fn::Sub: scamguard-aurora-client-${Environment}
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: scamguard-aurora-deps-${Environment}
      Description: 'Python dependencies for Aurora-backed Lambda functions. Includes
        psycopg2-binary, aws-lambda-powertools.

        '
      ContentUri: ../layers
      CompatibleRuntimes:
      - python3.12
  ScamGuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: scamguard-handler-aurora-${Environment}
      CodeUri: ../lambda_/handlers
      Handler: handler.lambda_handler
      Description: 'Main ScamGuard request handler. Routes analyze, scenarios, profile,
        and notification endpoints. Queries Aurora via psycopg2 (replaces DynamoDB).

        '
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      Policies:
      - AWSXRayDaemonWriteAccess
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Ref: AuroraSecretArn
        - Effect: Allow
          Action:
          - rds-data:ExecuteStatement
          - rds-data:BatchExecuteStatement
          - rds-data:BeginTransaction
          - rds-data:CommitTransaction
          - rds-data:RollbackTransaction
          Resource:
            Ref: AuroraClusterArn
        - Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          Resource:
          - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAIApiKeyParam}
          - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParam}
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Events:
        PostAnalysis:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/analyze
            Method: POST
        PostScenarios:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/scenarios
            Method: POST
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/profile
            Method: GET
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/profile
            Method: PUT
        GetNotificationPrefs:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/notifications/preferences
            Method: GET
        PutNotificationPrefs:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/notifications/preferences
            Method: PUT
        GetAnalytics:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/analytics/summary
            Method: GET
      Layers:
      - Ref: PythonDependenciesLayer
    Metadata:
      SamResourceId: ScamGuardFunction
  ThreatsHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: scamguard-threats-aurora-${Environment}
      CodeUri: ../lambda_/handlers
      Handler: threats_handler.lambda_handler
      Description: Threat feed and matching (Aurora-backed)
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Ref: AuroraSecretArn
        - Effect: Allow
          Action:
          - rds-data:ExecuteStatement
          - rds-data:BatchExecuteStatement
          Resource:
            Ref: AuroraClusterArn
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Events:
        GetThreats:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/threats
            Method: GET
            Auth:
              Authorizer: NONE
        GetThreatDetail:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/threats/{threat_id}
            Method: GET
            Auth:
              Authorizer: NONE
        PostThreatsMatch:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/threats/match
            Method: POST
            Auth:
              Authorizer: NONE
        GetThreatsFeed:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/threats/feed
            Method: GET
            Auth:
              Authorizer: NONE
      Layers:
      - Ref: PythonDependenciesLayer
    Metadata:
      SamResourceId: ThreatsHandler
  SmsAuthHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: scamguard-sms-auth-aurora-${Environment}
      CodeUri: ../lambda_/handlers
      Handler: auth_handler.lambda_handler
      Description: SMS OTP + Cognito auth (Aurora-backed OTP store)
      MemorySize: 512
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      Environment:
        Variables:
          COGNITO_USER_POOL_ID:
            Ref: ScamGuardUserPool
          COGNITO_CLIENT_ID:
            Ref: ScamGuardUserPoolClient
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Ref: AuroraSecretArn
        - Effect: Allow
          Action:
          - sns:Publish
          Resource: '*'
        - Effect: Allow
          Action:
          - cognito-idp:SignUp
          - cognito-idp:InitiateAuth
          - cognito-idp:ConfirmSignUp
          - cognito-idp:AdminGetUser
          - cognito-idp:ResendConfirmationCode
          Resource:
            Fn::GetAtt:
            - ScamGuardUserPool
            - Arn
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Events:
        PostRequestOtp:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/request-sms-otp
            Method: POST
            Auth:
              Authorizer: NONE
        PostVerifyOtp:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/verify-sms-otp
            Method: POST
            Auth:
              Authorizer: NONE
        PostRequestPasswordReset:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/request-password-reset
            Method: POST
            Auth:
              Authorizer: NONE
        PostResetPassword:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/reset-password
            Method: POST
            Auth:
              Authorizer: NONE
        PostValidateSession:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/validate-session
            Method: POST
            Auth:
              Authorizer: NONE
        PostRefreshSession:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/refresh-session
            Method: POST
            Auth:
              Authorizer: NONE
        PostSignupSms:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
        PostLoginSms:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        PostVerifyEmailSms:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/verify-email
            Method: POST
            Auth:
              Authorizer: NONE
        PostResendCodeSms:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/resend-code
            Method: POST
            Auth:
              Authorizer: NONE
        PostLogout:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/auth/logout
            Method: POST
      Layers:
      - Ref: PythonDependenciesLayer
    Metadata:
      SamResourceId: SmsAuthHandler
  FamilyHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: scamguard-family-aurora-${Environment}
      CodeUri: ../lambda_/handlers
      Handler: family_handler.lambda_handler
      Description: Family group management (Aurora-backed)
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Ref: AuroraSecretArn
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Events:
        GetFamilyDashboard:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/family/dashboard
            Method: GET
        PostFamilyCreate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/family/create
            Method: POST
        PostFamilyJoin:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/family/join
            Method: POST
      Layers:
      - Ref: PythonDependenciesLayer
    Metadata:
      SamResourceId: FamilyHandler
  ReportsToolsHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: scamguard-reports-tools-aurora-${Environment}
      CodeUri: ../lambda_/handlers
      Handler: reports_tools_handler.lambda_handler
      Description: Scam reports submission + email/advisor verification tools (Aurora-backed)
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Ref: AuroraSecretArn
        - Effect: Allow
          Action:
          - ssm:GetParameter
          Resource:
          - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scamguard/hibp-key
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Events:
        PostReport:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/reports
            Method: POST
        PostLegacyScamReport:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/scam-reports
            Method: POST
            Auth:
              Authorizer: NONE
        PostCheckEmail:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/tools/check-email
            Method: POST
            Auth:
              Authorizer: NONE
        PostCheckAdvisor:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ScamGuardApi
            Path: /api/v1/tools/check-advisor
            Method: POST
            Auth:
              Authorizer: NONE
      Layers:
      - Ref: PythonDependenciesLayer
    Metadata:
      SamResourceId: ReportsToolsHandler
  MainHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/scamguard-handler-aurora-${Environment}
      RetentionInDays: 3
  ThreatsHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/scamguard-threats-aurora-${Environment}
      RetentionInDays: 3
  SmsAuthHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/scamguard-sms-auth-aurora-${Environment}
      RetentionInDays: 3
  FamilyHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/scamguard-family-aurora-${Environment}
      RetentionInDays: 3
  ReportsToolsHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/scamguard-reports-tools-aurora-${Environment}
      RetentionInDays: 3
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: scamguard-aurora-lambda-errors-${Environment}
      AlarmDescription: Lambda function errors (Aurora stack)
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: ScamGuardFunction
Outputs:
  ApiEndpoint:
    Description: "HTTP v2 API Gateway endpoint (Aurora-backed). Uses $default stage\
      \ — no stage prefix in URL. Example: https://<id>.execute-api.us-east-1.amazonaws.com/api/v1/...\n"
    Value:
      Fn::Sub: https://${ScamGuardApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name:
        Fn::Sub: ScamGuard-Aurora-ApiEndpoint-${Environment}
  UserPoolId:
    Description: Cognito User Pool ID (Aurora stack)
    Value:
      Ref: ScamGuardUserPool
    Export:
      Name:
        Fn::Sub: ScamGuard-Aurora-UserPoolId-${Environment}
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: ScamGuardUserPoolClient
    Export:
      Name:
        Fn::Sub: ScamGuard-Aurora-UserPoolClientId-${Environment}
  ScamGuardFunctionArn:
    Description: Main handler Lambda ARN
    Value:
      Fn::GetAtt:
      - ScamGuardFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ScamGuard-Aurora-FunctionArn-${Environment}
