AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'ScamGuard MVP - Scam Detection & Education Platform for Elderly Users'

Conditions:
  IsPOC: !Equals [!Ref Environment, poc]
  IsProduction: !Equals [!Ref Environment, prod]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [poc, dev, staging, prod]
    Description: Deployment environment (poc = free tier, dev/staging = intermediate, prod = full capacity)

  ImageRepoUri:
    Type: String
    Default: public.ecr.aws/lambda/python:3.12
    Description: Docker image for Lambda

  DynamoDBTableName:
    Type: String
    Default: ScamGuardData
    Description: DynamoDB table for user data

  AuditTableName:
    Type: String
    Default: ScamGuardAudit
    Description: DynamoDB table for audit logs

  OTPTableName:
    Type: String
    Default: ScamGuardOTP
    Description: DynamoDB table for SMS OTP tracking

  PinpointProjectId:
    Type: String
    Default: ''
    Description: AWS Pinpoint project ID for SMS delivery

  ReservedConcurrentExecutions:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
    Description: Reserved concurrent executions for Lambda

  OpenAIApiKeyParam:
    Type: String
    Default: /scamguard/openai-key
    Description: SSM Parameter Store path for OpenAI key

  GeminiApiKeyParam:
    Type: String
    Default: /scamguard/gemini-key
    Description: SSM Parameter Store path for Gemini key

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref DataTable
        DYNAMODB_AUDIT_TABLE: !Ref AuditTable
        OTP_TABLE: !Ref OTPTable
        ENVIRONMENT: !Ref Environment
        OPENAI_PARAM: !Ref OpenAIApiKeyParam
        GEMINI_PARAM: !Ref GeminiApiKeyParam
        XRAY_ENABLED: 'true'

Resources:
  # ============================================================================
  # DynamoDB Tables
  # ============================================================================

  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${DynamoDBTableName}-${Environment}'
      # POC: Use PAY_PER_REQUEST ($0-5/mth). Prod: Use PROVISIONED ($25/mth)
      BillingMode: !If [IsPOC, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsPOC
        - !Ref AWS::NoValue
        - ReadCapacityUnits: 25
          WriteCapacityUnits: 25
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AuditTableName}-${Environment}'
      # POC: Use PAY_PER_REQUEST ($0-5/mth). Prod: Use PROVISIONED ($25/mth)
      BillingMode: !If [IsPOC, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsPOC
        - !Ref AWS::NoValue
        - ReadCapacityUnits: 25
          WriteCapacityUnits: 25
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment

  OTPTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${OTPTableName}-${Environment}'
      # SMS OTP is time-sensitive, use PAY_PER_REQUEST for cost efficiency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: SMS OTP Tracking

  ThreatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ScamGuardThreats-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Threat Scenario Library

  ThreatInteractionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ScamGuardThreatInteractions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: User Threat Interactions

  # ============================================================================
  # CloudWatch Log Groups with 3-day retention
  # ============================================================================

  ScamGuardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/scamguard-handler-${Environment}'
      RetentionInDays: 3

  AuthHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/scamguard-auth-${Environment}'
      RetentionInDays: 3

  SMSOTPHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/scamguard-sms-otp-${Environment}'
      RetentionInDays: 3

  ThreatsHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/scamguard-threats-${Environment}'
      RetentionInDays: 3

  FamilyHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/scamguard-family-${Environment}'
      RetentionInDays: 3

  # ============================================================================
  # Lambda Layer - Python Dependencies
  # ============================================================================

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'scamguard-dependencies-${Environment}'
      Description: Python dependencies for ScamGuard
      ContentUri: ./layers/python_dependencies/
      CompatibleRuntimes:
        - python3.12

  # ============================================================================
  # Cognito User Pool (Authentication)
  # ============================================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'scamguard-users-${Environment}'
      MfaConfiguration: 'OFF'
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: email_verified
          AttributeDataType: Boolean
          Mutable: true
        - Name: age_verified
          AttributeDataType: Boolean
          Mutable: true
        - Name: terms_accepted
          AttributeDataType: Boolean
          Mutable: true
        - Name: data_consent
          AttributeDataType: Boolean
          Mutable: true
        - Name: mfa_enabled
          AttributeDataType: Boolean
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub 'scamguard-client-${Environment}'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      PreventUserExistenceErrors: LEGACY

  # ============================================================================
  # API Gateway
  # ============================================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'scamguard-api-${Environment}'
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ============================================================================
  # Lambda Functions
  # ============================================================================

  ScamGuardFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScamGuardFunctionLogGroup
    Properties:
      FunctionName: !Sub 'scamguard-handler-${Environment}'
      CodeUri: lambda_/
      Handler: handler.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 60
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DataTable
          DYNAMODB_AUDIT_TABLE: !Ref AuditTable
          ENVIRONMENT: !Ref Environment
          CACHE_TTL_DAYS: '30'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAIApiKeyParam}'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParam}'
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      Events:
        PostScenarios:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/scenarios
            Method: POST
        PostAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/analysis
            Method: POST
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/profile
            Method: GET
        GetAnalytics:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/analytics/summary
            Method: GET
      Layers:
        - !Ref PythonDependenciesLayer

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'scamguard-sms-${Environment}'
      DisplayName: ScamGuard SMS OTP
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment

  # AuthHandler (DynamoDB-backed) retired — routes migrated to SMSOTPHandler (Aurora)
  # Legacy code kept in lambda_/_legacy/auth_handler.py for reference

  VerifyOTPHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/scamguard-verify-otp-${Environment}'
      RetentionInDays: 3

  VerifyOTPHandler:
    Type: AWS::Serverless::Function
    DependsOn: VerifyOTPHandlerLogGroup
    Properties:
      FunctionName: !Sub 'scamguard-verify-otp-${Environment}'
      CodeUri: lambda_/handlers/
      Handler: verify_otp_handler.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          AURORA_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}'
          AURORA_DATABASE: scamguard
          ENVIRONMENT: !Ref Environment
          JWT_SECRET_PARAM: !Sub '/scamguard/jwt-secret-${Environment}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scamguard/jwt-secret-${Environment}'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      Events:
        PostVerifyOtp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/verify-otp
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsVerifyOtp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/verify-otp
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostVerifySmsOtpAlias:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/verify-sms-otp
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsVerifySmsOtpAlias:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/verify-sms-otp
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Layers:
        - !Ref PythonDependenciesLayer

  SMSOTPHandler:
    Type: AWS::Serverless::Function
    DependsOn: SMSOTPHandlerLogGroup
    Properties:
      FunctionName: !Sub 'scamguard-sms-otp-${Environment}'
      # Aurora-backed auth handler (request-sms-otp + all signup/login routes)
      CodeUri: lambda_/handlers/
      Handler: auth_handler.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          AURORA_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}'
          AURORA_DATABASE: scamguard
          ENVIRONMENT: !Ref Environment
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminGetUser
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ResendConfirmationCode
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}*'
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SNSTopic
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      Events:
        PostRequestSmsOtp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/request-sms-otp
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsRequestSmsOtp:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/request-sms-otp
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostSignup:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsSignup:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/signup
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostLogin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsLogin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/login
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostLogout:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/logout
            Method: POST
        OptionsLogout:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/logout
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostVerifyEmail:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/verify-email
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsVerifyEmail:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/verify-email
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostResendCode:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/resend-code
            Method: POST
            Auth:
              Authorizer: NONE
        OptionsResendCode:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/resend-code
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostValidateSession:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/validate-session
            Method: POST
            Auth:
              Authorizer: NONE
        PostRefreshSession:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/refresh-session
            Method: POST
            Auth:
              Authorizer: NONE
        PostRequestPasswordReset:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/request-password-reset
            Method: POST
            Auth:
              Authorizer: NONE
        PostResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/auth/reset-password
            Method: POST
            Auth:
              Authorizer: NONE
      Layers:
        - !Ref PythonDependenciesLayer

  ThreatsHandler:
    Type: AWS::Serverless::Function
    DependsOn: ThreatsHandlerLogGroup
    Properties:
      FunctionName: !Sub 'scamguard-threats-${Environment}'
      # Aurora-backed threats handler
      CodeUri: lambda_/handlers/
      Handler: threats_handler.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          AURORA_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}'
          AURORA_DATABASE: scamguard
          ENVIRONMENT: !Ref Environment
          ALLOWED_ORIGIN: '*'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      Events:
        GetThreats:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats
            Method: GET
            Auth:
              Authorizer: NONE
        GetThreatsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        GetThreatDetail:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats/{threat_id}
            Method: GET
            Auth:
              Authorizer: NONE
        GetThreatDetailOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats/{threat_id}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostThreatsMatch:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats/match
            Method: POST
            Auth:
              Authorizer: NONE
        PostThreatsMatchOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats/match
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        GetThreatsFeed:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats/feed
            Method: GET
            Auth:
              Authorizer: NONE
        GetThreatsFeedOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/threats/feed
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Layers:
        - !Ref PythonDependenciesLayer

  FamilyHandler:
    Type: AWS::Serverless::Function
    DependsOn: FamilyHandlerLogGroup
    Properties:
      FunctionName: !Sub 'scamguard-family-${Environment}'
      # Aurora-backed family handler
      CodeUri: lambda_/handlers/
      Handler: family_handler.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          AURORA_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}'
          AURORA_DATABASE: scamguard
          ENVIRONMENT: !Ref Environment
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scamguard-aurora-${Environment}*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      Events:
        GetFamilyDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/family/dashboard
            Method: GET
        OptionsFamilyDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/family/dashboard
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostFamilyCreate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/family/create
            Method: POST
        OptionsFamilyCreate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/family/create
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PostFamilyJoin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/family/join
            Method: POST
        OptionsFamilyJoin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/v1/family/join
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # ============================================================================
  # CloudWatch Monitoring
  # ============================================================================

  ComplianceViolationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'scamguard-compliance-violations-${Environment}'
      AlarmDescription: Alert when compliance checks are blocked
      MetricName: operation_blocked
      Namespace: ScamGuard
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'scamguard-lambda-errors-${Environment}'
      AlarmDescription: Alert on Lambda function errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScamGuardFunction

  DynamoDBThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'scamguard-dynamodb-throttling-${Environment}'
      AlarmDescription: Alert on DynamoDB throttling
      MetricName: ConsumedWriteCapacityUnits
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref DataTable

  # ============================================================================
  # S3 Bucket for Lambda Artifacts & Backups
  # ============================================================================

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'scamguard-artifacts-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldObjects
            Status: Enabled
            ExpirationInDays: 7
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: ScamGuard
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # CloudFormation Outputs
  # ============================================================================

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
    Export:
      Name: !Sub 'ScamGuard-ApiEndpoint-${Environment}'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub 'ScamGuard-UserPoolId-${Environment}'

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub 'ScamGuard-UserPoolClientId-${Environment}'

  DataTableName:
    Description: DynamoDB Data Table Name
    Value: !Ref DataTable
    Export:
      Name: !Sub 'ScamGuard-DataTable-${Environment}'

  AuditTableName:
    Description: DynamoDB Audit Table Name
    Value: !Ref AuditTable
    Export:
      Name: !Sub 'ScamGuard-AuditTable-${Environment}'

  OTPTableName:
    Description: DynamoDB OTP Table Name
    Value: !Ref OTPTable
    Export:
      Name: !Sub 'ScamGuard-OTPTable-${Environment}'

  ScamGuardFunctionArn:
    Description: ScamGuard Lambda Function ARN
    Value: !GetAtt ScamGuardFunction.Arn
    Export:
      Name: !Sub 'ScamGuard-FunctionArn-${Environment}'

  AuthHandlerArn:
    Description: Aurora Auth Handler Lambda Function ARN (formerly DynamoDB AuthHandler)
    Value: !GetAtt SMSOTPHandler.Arn
    Export:
      Name: !Sub 'ScamGuard-AuthHandlerArn-${Environment}'

  SMSOTPHandlerArn:
    Description: SMS OTP + Auth Handler Lambda Function ARN (Aurora-backed)
    Value: !GetAtt SMSOTPHandler.Arn
    Export:
      Name: !Sub 'ScamGuard-SMSOTPHandlerArn-${Environment}'

  VerifyOTPHandlerArn:
    Description: Verify OTP Handler Lambda Function ARN (family JWT issuance)
    Value: !GetAtt VerifyOTPHandler.Arn
    Export:
      Name: !Sub 'ScamGuard-VerifyOTPHandlerArn-${Environment}'

  FamilyHandlerArn:
    Description: Family Handler Lambda Function ARN
    Value: !GetAtt FamilyHandler.Arn
    Export:
      Name: !Sub 'ScamGuard-FamilyHandlerArn-${Environment}'

  ArtifactsBucketName:
    Description: S3 Bucket for artifacts and backups
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub 'ScamGuard-ArtifactsBucket-${Environment}'
