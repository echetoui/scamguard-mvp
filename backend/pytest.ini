[pytest]
# Pytest configuration for ScamGuard backend

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=lambda_
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Coverage options
[coverage:run]
source = lambda_
omit =
    */tests/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
