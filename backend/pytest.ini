[pytest]
# Pytest configuration for ScamGuard backend

# Python path configuration - ensure backend modules are importable
pythonpath = .

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options — coverage config delegated to .coveragerc
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=lambda_
    --cov-config=.coveragerc
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
