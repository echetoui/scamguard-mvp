# SAM Configuration for ScamGuard Deployment

version = 0.1

[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "scamguard-mvp"
s3_bucket = "scamguard-deployment-artifacts"
s3_prefix = "sam-deployments"
region = "us-east-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM,CAPABILITY_NAMED_IAM"
disable_rollback = false
parameter_overrides = [
  "Environment=dev",
  "ImageRepoUri=public.ecr.aws/lambda/python:3.12",
  "DynamoDBTableName=ScamGuardData",
  "AuditTableName=ScamGuardAudit"
]
