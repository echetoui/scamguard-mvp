name: Test & Coverage

on:
  push:
    branches: [develop, main, feature/**]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 backend/lambda backend/tests --count --statistics --max-line-length=100

      - name: Format check with black
        run: |
          black --check backend/lambda backend/tests

      - name: Type checking with mypy
        continue-on-error: true
        run: |
          mypy backend/lambda --ignore-missing-imports

      - name: Run pytest
        run: |
          cd backend
          pytest tests -v --cov=lambda_ --cov-report=xml --cov-report=html

      - name: Check coverage threshold
        run: |
          cd backend
          coverage report --fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
