name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d build ]; then echo "Build directory not found!"; exit 1; fi
          if [ ! -f build/index.html ]; then echo "index.html not found in build!"; exit 1; fi
          echo "✅ Build successful"

  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f lambda_/requirements.txt ]; then pip install -r lambda_/requirements.txt; fi
          pip install pytest pytest-cov pytest-mock moto boto3 requests python-dotenv pyotp phonenumbers

      - name: Run tests
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/lambda_:$PYTHONPATH"
          pytest tests/